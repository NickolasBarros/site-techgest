<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gradTechGest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A84FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BF5AF2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fundo circular -->
  <circle cx="100" cy="100" r="95" fill="#0A0E14"/>

  <!-- Engrenagem (dentes) -->
  <g fill="url(#gradTechGest)">
    <rect x="95" y="15" width="10" height="18" rx="3"/>
    <rect x="95" y="167" width="10" height="18" rx="3"/>
    <rect x="15" y="95" width="18" height="10" rx="3"/>
    <rect x="167" y="95" width="18" height="10" rx="3"/>
    <rect x="41" y="41" width="10" height="18" rx="3" transform="rotate(-45 46 50)"/>
    <rect x="149" y="149" width="10" height="18" rx="3" transform="rotate(-45 154 158)"/>
    <rect x="149" y="33" width="10" height="18" rx="3" transform="rotate(45 154 42)"/>
    <rect x="41" y="141" width="10" height="18" rx="3" transform="rotate(45 46 150)"/>
  </g>

  <!-- Círculo externo da engrenagem -->
  <circle cx="100" cy="100" r="55" fill="none" stroke="url(#gradTechGest)" stroke-width="8"/>
  <circle cx="100" cy="100" r="35" fill="#0A0E14" stroke="url(#gradTechGest)" stroke-width="4"/>

  <!-- Letra T central -->
  <g fill="url(#gradTechGest)">
    <rect x="72" y="78" width="56" height="12" rx="3"/>
    <rect x="94" y="78" width="12" height="52" rx="3"/>
  </g>

  <!-- Ponto de destaque -->
  <circle cx="135" cy="65" r="8" fill="#0A84FF"/>
</svg>